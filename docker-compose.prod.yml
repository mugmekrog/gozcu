# ------------------------------------------------------------------------------
# Docker Compose: Production / Demo Simulation
# ------------------------------------------------------------------------------
# Runs the exact production containers:
# - backend: Cloud Run production image
# - frontend: Built static assets previewed via Vite preview container
# ------------------------------------------------------------------------------

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goru-backend-prod
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: preview
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: goru-frontend-prod
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
