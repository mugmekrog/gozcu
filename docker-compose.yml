# ------------------------------------------------------------------------------
# Docker Compose: Local Full-Stack Development
# ------------------------------------------------------------------------------
# Mirrors production architecture:
# - backend:  Google Cloud Run container simulation on port 8080
# - stt:      Turkish speech service on localhost port 8800
# - frontend: React / Vite development on port 5173 (pointing to backend)
# ------------------------------------------------------------------------------

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goru-backend
    ports:
      # Loopback only: the API spends the $15 budget. GORU_API_PORT moves the host
      # side when 8080 is taken on this machine (the container still listens on 8080).
      - "127.0.0.1:${GORU_API_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    volumes:
      # Mount application code for local live reloading without rebuilding container
      - ./libs:/app/libs:ro
      - ./services:/app/services:ro
      - ./web/scripts:/app/web/scripts:ro
      - ./goru.yaml:/app/goru.yaml:ro
      - operator-decisions:/app/data/processed
    command: ["uvicorn", "app.api.rest:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  stt:
    build:
      context: .
      dockerfile: Dockerfile.stt
    container_name: goru-stt
    ports:
      - "127.0.0.1:8800:8800"
    env_file:
      - path: .env
        required: false
    environment:
      - HF_TOKEN
    volumes:
      - stt-model-cache:/app/data/huggingface
      - ./libs:/app/libs:ro
      - ./services:/app/services:ro
      - ./contracts:/app/contracts:ro
      - ./goru.yaml:/app/goru.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/stt/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15m
    restart: unless-stopped

  frontend:
    image: goru-frontend-dev
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    container_name: goru-frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:${GORU_API_PORT:-8080}
      - VITE_STT_URL=http://127.0.0.1:8800
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/index.html:/app/index.html
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      stt:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stt-model-cache:
  operator-decisions:
