# ------------------------------------------------------------------------------
# Docker Compose: Local Full-Stack Development
# ------------------------------------------------------------------------------
# Mirrors production architecture:
# - backend:  Google Cloud Run container simulation on port 8080
# - frontend: React / Vite development on port 5173 (pointing to backend)
# ------------------------------------------------------------------------------

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goru-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    volumes:
      # Mount application code for local live reloading without rebuilding container
      - ./libs:/app/libs:ro
      - ./services:/app/services:ro
      - ./goru.yaml:/app/goru.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    container_name: goru-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
